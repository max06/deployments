id: classify_inbox
namespace: homelab.mail
description: |
  Labels inbox mails with the local LLM: every unlabeled mail in the inbox
  gets one label below AI/ in Fastmail (AI/personal, AI/finance, ...).

  Phase 1, labels only: nothing leaves the inbox, nothing is marked read or
  flagged. Actions per category come once the labels have proven reliable.

  Every 2 minutes the flow takes the `batch_size` newest inbox mails that
  carry no AI/ label yet, so new mail is handled first and older mail
  follows in later runs (backfill). For each one:

  - fetches the text body (Fastmail decodes base64 and quoted-printable,
    and caps the size with maxBodyValueBytes);
  - checks the fixed `rules` (sender domain plus a header pattern);
  - classifies it with homelab.mail.classify_email, which takes a matching
    rule's category for a verified sender and asks the model otherwise;
  - adds the label AI/<category>.

  Processed means "has an AI/ label". To classify mails again (after a
  prompt change, say), remove their AI/ labels in Fastmail.

  Setup: the label AI with one sub-label per category of classify_email
  must exist. A missing one fails the run with its name.

  Results: the task log_results logs every mail of the run (label, subject,
  sender, the rule or the model's reason) in one entry of this execution's
  log.

  Failures: a failed LLM call fails the iteration (after classify_email's
  retries), and the mail stays unlabeled for the next run. The other mails
  are still processed; the run ends as failed (require_all_ok), and the
  iteration's error is in the log view with the filter Kind = Loop.

  Secrets: FASTMAIL_JMAP_TOKEN (Fastmail API token, mail read/write),
  RADIANCE_API_KEY (through classify_email).

concurrency:
  # Never two runs at once: both would pick the same mails.
  limit: 1
  behavior: CANCEL

variables:
  jmap_session_url: https://api.fastmail.com/jmap/session
  # Mails per run. Every 2 minutes that's up to 300 an hour, plenty for new
  # mail and a steady backfill.
  batch_size: 10
  # Parent label of the categories.
  label_parent: AI
  # Body size Fastmail returns per part. Big HTML mails are mostly markup;
  # classify_email keeps the first few KB of the text that remains.
  max_body_bytes: 200000
  # Outlook and Gmail forward the old addresses to Fastmail addresses with
  # the plus tag redirect.<provider>. Mail delivered there broke Fastmail's
  # DMARC check on the way (Outlook alters the body and doesn't ARC-seal),
  # so the forwarder's own verdict counts instead (see classify_email).
  forwarder_address_regex: '\+redirect\.'

  # Fixed rules, checked before the model: many senders label their mail
  # in a header (template, campaign or message type), and that's more
  # reliable than the model. The first rule that matches sets the
  # category, and the model isn't asked.
  #
  #   domain    the sender domain (From), or a subdomain of it
  #   header    the header to look at; any name, including From and Subject
  #   pattern   regex (Java, find semantics: anywhere in the value);
  #             single quotes keep backslashes literal
  #   category  one of classify_email's categories
  #
  # A rule only counts when the sender check says "yes" (DMARC pass for
  # that domain): anyone can write these headers, but only the real sender
  # passes DMARC for its domain. Otherwise the model decides as usual, and
  # the log says the rule was not applied.
  #
  # The headers were picked from a survey of the inbox (2026-11-26); the
  # comment above each rule says what its values mean.
  rules:
    # The only Steam type seen: a game on the wishlist is on sale.
    - name: steam wishlist sale
      domain: steampowered.com
      header: X-Steam-Message-Type
      pattern: '^CEmailWishlistItemOnSale$'
      category: notifications
    # Discourse summaries and replies list the topics they cover.
    - name: nixos discourse
      domain: discourse.nixos.org
      header: X-Discourse-Topic-Ids
      pattern: '.'
      category: notifications
    # flaschenpost names every mail type in X-CampaignID.
    - name: flaschenpost invoice
      domain: flaschenpost.de
      header: X-CampaignID
      pattern: '^fp_service_invoice'
      category: finance
    - name: flaschenpost delivery notice
      domain: flaschenpost.de
      header: X-CampaignID
      pattern: '^fp_service_deliverynotice'
      category: shipping
    - name: flaschenpost preorder
      domain: flaschenpost.de
      header: X-CampaignID
      pattern: '^fp_service_preorder'
      category: orders
    # WMY_<year>_fp_service_mail_<n>: a numbered series, not tied to an
    # order; the model called all of them newsletter.
    - name: flaschenpost campaign
      domain: flaschenpost.de
      header: X-CampaignID
      pattern: '^WMY_'
      category: newsletter
    # Airbnb's X-Template: OTP_* codes and TRUST_ACCOUNT_ALERT_* (new
    # device, changed e-mail, passkey added) are account access;
    # PRIVACY_* are the inactive-account deletion notices.
    - name: airbnb account access
      domain: airbnb.com
      header: X-Template
      pattern: '^(OTP_|TRUST_ACCOUNT_ALERT_)'
      category: security
    - name: airbnb privacy notice
      domain: airbnb.com
      header: X-Template
      pattern: '^PRIVACY_'
      category: notifications
    # Slack: sign-in codes and new sign-in alerts.
    - name: slack sign-in
      domain: slack.com
      header: X-Slack-Email-Template
      pattern: '(confirmation_email_code|feat_login_notify)$'
      category: security
    # Uber sends through Mailgun: campaigns carry a campaign_id in
    # X-Mailgun-Variables, ride receipts the tag completed_receipt.
    - name: uber campaign
      domain: uber.com
      header: X-Mailgun-Variables
      pattern: '"campaign_id"'
      category: newsletter
    - name: uber receipt
      domain: uber.com
      header: X-Mailgun-Tag
      pattern: '^completed_receipt$'
      category: orders
    # Amazon tells its mail types apart by the sender address only.
    - name: amazon order
      domain: amazon.de
      header: From
      pattern: '<(bestellbestaetigung|order-update)@amazon\.de>'
      category: orders
    - name: amazon shipping
      domain: amazon.de
      header: From
      pattern: '<(versandbestaetigung|shipment-tracking)@amazon\.de>'
      category: shipping
    # LinkedIn's X-LinkedIn-Template: email_m2m_invite_* are connection
    # requests from people and their reminders; the network update digest
    # is LinkedIn's own marketing.
    - name: linkedin connection request
      domain: linkedin.com
      header: X-LinkedIn-Template
      pattern: '^email_m2m_invite'
      category: career
    - name: linkedin network digest
      domain: linkedin.com
      header: X-LinkedIn-Template
      pattern: '^email_your_network_update_digest'
      category: newsletter

tasks:
  # The session names the account id and the API endpoint.
  - id: jmap_session
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.jmap_session_url }}"
    headers:
      Authorization: "Bearer {{ secret('FASTMAIL_JMAP_TOKEN') }}"

  - id: jmap
    type: io.kestra.plugin.core.output.OutputValues
    values:
      account_id: >-
        {{ outputs.jmap_session.body
           | jq('.primaryAccounts["urn:ietf:params:jmap:mail"]') | first }}
      api_url: "{{ outputs.jmap_session.body | jq('.apiUrl') | first }}"

  # All mailboxes (labels): small, and it names the inbox and the AI labels.
  - id: get_mailboxes
    type: io.kestra.plugin.core.http.Request
    method: POST
    uri: "{{ outputs.jmap.values.api_url }}"
    headers:
      Authorization: "Bearer {{ secret('FASTMAIL_JMAP_TOKEN') }}"
    contentType: application/json
    body: |
      {{ {
        "using": ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"],
        "methodCalls": [
          ["Mailbox/get", {
            "accountId": outputs.jmap.values.account_id,
            "properties": ["id", "name", "parentId", "role"]
          }, "mailboxes"]
        ]
      } | toJson }}

  # inbox_id: the mailbox with role inbox.
  # ai_labels: {"<category>": "<mailbox id>"} for the children of the
  # top-level label AI ({} when there is no such label).
  - id: labels
    type: io.kestra.plugin.core.output.OutputValues
    values:
      inbox_id: >-
        {{ outputs.get_mailboxes.body
           | jq('.methodResponses[0][1].list[] | select(.role == "inbox") | .id')
           | first }}
      ai_labels: >-
        {{ outputs.get_mailboxes.body
           | jq('.methodResponses[0][1].list as $all
                 | (first($all[] | select(.name == "' ~ vars.label_parent ~ '" and .parentId == null) | .id) // "none") as $parent
                 | [$all[] | select(.parentId == $parent) | {(.name): .id}] | add // {}')
           | first | toJson }}

  - id: require_labels
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ fromJson(outputs.labels.values.ai_labels) | length == 0 }}"
    errorMessage: >-
      No labels below "{{ vars.label_parent }}" in Fastmail. Create the label
      {{ vars.label_parent }} with one sub-label per category of
      homelab.mail.classify_email.

  # Newest unlabeled inbox mails: in the inbox AND in none of the AI labels.
  # The properties to fetch per mail: the fixed ones plus every header a
  # rule looks at (JMAP fetches single headers by name).
  - id: fetch_properties
    type: io.kestra.plugin.core.output.OutputValues
    values:
      list: >-
        {{ vars.rules | toJson
           | jq('["id", "subject", "receivedAt", "from",
                  "header:Authentication-Results:asText:all",
                  "header:X-Delivered-to:asText:all",
                  "header:X-Received-Authentication-Results:asText:all"]
                 + ([.[].header] | unique | map("header:" + . + ":asText:all"))')
           | first | toJson }}

  # Metadata only (the 1 MB task-result limit); each iteration fetches its
  # own body.
  - id: fetch_unlabeled
    type: io.kestra.plugin.core.http.Request
    method: POST
    uri: "{{ outputs.jmap.values.api_url }}"
    headers:
      Authorization: "Bearer {{ secret('FASTMAIL_JMAP_TOKEN') }}"
    contentType: application/json
    body: |
      {{ {
        "using": ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"],
        "methodCalls": [
          ["Email/query", {
            "accountId": outputs.jmap.values.account_id,
            "filter": {"operator": "AND", "conditions": [
              {"inMailbox": outputs.labels.values.inbox_id},
              {"operator": "NOT", "conditions":
                (outputs.labels.values.ai_labels | jq('[.[] | {inMailbox: .}]') | first)}
            ]},
            "sort": [{"property": "receivedAt", "isAscending": false}],
            "limit": vars.batch_size
          }, "query"],
          ["Email/get", {
            "accountId": outputs.jmap.values.account_id,
            "#ids": {"resultOf": "query", "name": "Email/query", "path": "/ids"},
            "properties": fromJson(outputs.fetch_properties.values.list)
          }, "get"]
        ]
      } | toJson }}

  # JMAP answers a refused method call with HTTP 200 and an "error" entry
  # in methodResponses; without this check the next step fails on a missing
  # list instead of showing Fastmail's reason.
  - id: require_query_ok
    type: io.kestra.plugin.core.execution.Fail
    condition: >-
      {{ outputs.fetch_unlabeled.body
         | jq('[.methodResponses[] | select(.[0] == "error")] | length') | first > 0 }}
    errorMessage: >-
      Fastmail refused the query:
      {{ outputs.fetch_unlabeled.body
         | jq('[.methodResponses[] | select(.[0] == "error") | .[1]]') | first | toJson }}

  # One compact object per mail.
  # auth: Fastmail writes its verdict as several Authentication-Results
  # headers, one per check (x-ptr, bimi, arc, dkim + dmarc), all with the
  # authserv-id <host>.messagingengine.com. They are joined here, one per
  # line. Headers of other servers are left out: forwarded mail carries
  # the old provider's verdict, and a sender can write any header it likes.
  # delivered_to: the address Fastmail delivered to. Fastmail adds
  # X-Delivered-to on top, so the first one is Fastmail's.
  # forwarder_auth: the verdicts of earlier servers; for forwarded mail
  # that includes the forwarder's check. Fastmail stores them in two ways:
  # older mail (seen September 2026) has them renamed to
  # X-Received-Authentication-Results, newer mail (November 2026) keeps
  # them as Authentication-Results with the other server's authserv-id,
  # e.g. mx.microsoft.com. Both are collected. A sender can plant such
  # headers too, but classify_email lets a fail or a missing result beat
  # any pass, so a planted pass can't outvote the forwarder's real verdict.
  # rule_name, rule_category: the first rule of vars.rules that matches
  # (sender domain or a subdomain of it, and the pattern found in one of
  # the values of its header), or "" for none. classify_email decides
  # whether it counts. The rules go into the jq program as a JSON literal.
  - id: unlabeled
    type: io.kestra.plugin.core.output.OutputValues
    values:
      emails: >-
        {{ outputs.fetch_unlabeled.body
           | jq('(' ~ (vars.rules | toJson) ~ ') as $rules
               | [.methodResponses[1][1].list[]
               | . as $mail
               | (((.from // [])[0].email // "") | ascii_downcase | split("@") | last // "") as $domain
               | (first($rules[] as $rule
                        | select($domain == $rule.domain or ($domain | endswith("." + $rule.domain)))
                        | select([($mail["header:" + $rule.header + ":asText:all"] // [])[]
                                  | select(test($rule.pattern))] | length > 0)
                        | $rule) // {}) as $matched_rule
               | {
                 id, subject: (.subject // ""), receivedAt,
                 rule_name: ($matched_rule.name // ""),
                 rule_category: ($matched_rule.category // ""),
                 from: ((.from // [])[0] // null
                        | if . == null then "" else ((.name // "") + " <" + .email + ">") end),
                 auth: ([(.["header:Authentication-Results:asText:all"] // [])[]
                         | select(test("^ *[A-Za-z0-9.-]+[.]messagingengine[.]com *;"))]
                        | join("\n")),
                 delivered_to: ((.["header:X-Delivered-to:asText:all"] // [])[0] // ""),
                 forwarder_auth: (((.["header:X-Received-Authentication-Results:asText:all"] // [])
                                   + [(.["header:Authentication-Results:asText:all"] // [])[]
                                      | select(test("^ *[A-Za-z0-9.-]+[.]messagingengine[.]com *;") | not)])
                                  | join("\n"))
               }]')
           | first | toJson }}

  - id: if_any
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.unlabeled.values.emails) | length > 0 }}"
    then:
      - id: each_email
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.unlabeled.values.emails }}"
        concurrencyLimit: 1
        tasks:
          # The text body of this one mail. textBody falls back to the HTML
          # parts when a mail has no plain-text version.
          - id: get_body
            type: io.kestra.plugin.core.http.Request
            method: POST
            uri: "{{ outputs.jmap.values.api_url }}"
            headers:
              Authorization: "Bearer {{ secret('FASTMAIL_JMAP_TOKEN') }}"
            contentType: application/json
            body: |
              {{ {
                "using": ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"],
                "methodCalls": [
                  ["Email/get", {
                    "accountId": outputs.jmap.values.account_id,
                    "ids": [fromJson(item.value).id],
                    "properties": ["textBody", "bodyValues"],
                    "fetchTextBodyValues": true,
                    "maxBodyValueBytes": vars.max_body_bytes
                  }, "body"]
                ]
              } | toJson }}

          - id: require_body_ok
            type: io.kestra.plugin.core.execution.Fail
            condition: >-
              {{ outputs.get_body.body
                 | jq('[.methodResponses[] | select(.[0] == "error")] | length') | first > 0 }}
            errorMessage: >-
              Fastmail refused the body request:
              {{ outputs.get_body.body
                 | jq('[.methodResponses[] | select(.[0] == "error") | .[1]]') | first | toJson }}

          - id: classify
            type: io.kestra.plugin.core.flow.Subflow
            namespace: homelab.mail
            flowId: classify_email
            inputs:
              from: "{{ fromJson(item.value).from }}"
              subject: "{{ fromJson(item.value).subject }}"
              authentication_results: "{{ fromJson(item.value).auth }}"
              # Only for mail that came through a forwarder of an old address.
              forwarder_authentication_results: >-
                {{ (fromJson(item.value).delivered_to | regexMatch(vars.forwarder_address_regex))
                   ? fromJson(item.value).forwarder_auth : '' }}
              # The matching rule of vars.rules, if any (see unlabeled).
              rule_name: "{{ fromJson(item.value).rule_name }}"
              rule_category: "{{ fromJson(item.value).rule_category }}"
              body: >-
                {{ outputs.get_body.body
                   | jq('.methodResponses[0][1].list[0]
                         | . as $mail | [($mail.textBody // [])[] | $mail.bodyValues[.partId].value // ""]
                         | join("\n")')
                   | first }}

          - id: label_id
            type: io.kestra.plugin.core.output.OutputValues
            values:
              id: "{{ fromJson(outputs.labels.values.ai_labels)[outputs.classify.outputs.category] ?? '' }}"

          - id: require_label
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ outputs.label_id.values.id is empty }}"
            errorMessage: >-
              Label {{ vars.label_parent }}/{{ outputs.classify.outputs.category }}
              is missing in Fastmail.

          - id: add_label
            type: io.kestra.plugin.core.http.Request
            method: POST
            uri: "{{ outputs.jmap.values.api_url }}"
            headers:
              Authorization: "Bearer {{ secret('FASTMAIL_JMAP_TOKEN') }}"
            contentType: application/json
            body: |
              {{ {
                "using": ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"],
                "methodCalls": [
                  ["Email/set", {
                    "accountId": outputs.jmap.values.account_id,
                    "update": {(fromJson(item.value).id): {("mailboxIds/" ~ outputs.label_id.values.id): true}}
                  }, "label"]
                ]
              } | toJson }}

          # JMAP reports a refused update in the response, with HTTP 200.
          - id: require_updated
            type: io.kestra.plugin.core.execution.Fail
            condition: >-
              {{ outputs.add_label.body
                 | jq('.methodResponses[0][1].notUpdated // {} | length') | first > 0 }}
            errorMessage: >-
              Fastmail refused the label:
              {{ outputs.add_label.body | jq('.methodResponses[0][1].notUpdated') | first | toJson }}

        # Every iteration is its own sub-execution, so its task outputs and
        # logs stay there (log view: filter Kind = Loop). The values below are
        # handed back to this execution as outputs.each_email.outputs: a list
        # of {item: {value, iteration}, outputs: {<id>: ...}}, one entry per
        # iteration. FETCH keeps them inline (10 small entries per run).
        # `?? ''` keeps the evaluation from failing for an iteration that
        # stopped before classify.
        fetchType: FETCH
        outputs:
          - id: subject
            type: STRING
            value: "{{ fromJson(item.value).subject }}"
          - id: from
            type: STRING
            value: "{{ fromJson(item.value).from }}"
          - id: received_at
            type: STRING
            value: "{{ fromJson(item.value).receivedAt }}"
          - id: category
            type: STRING
            value: "{{ outputs.classify.outputs.category ?? '' }}"
          - id: model_category
            type: STRING
            value: "{{ outputs.classify.outputs.model_category ?? '' }}"
          - id: reason
            type: STRING
            value: "{{ outputs.classify.outputs.reason ?? '' }}"
          - id: dmarc_override
            type: BOOL
            value: "{{ outputs.classify.outputs.dmarc_override ?? false }}"
          - id: sender_verified
            type: STRING
            value: "{{ outputs.classify.outputs.sender_verified ?? '' }}"
          - id: rule
            type: STRING
            value: "{{ outputs.classify.outputs.rule ?? '' }}"
        # One mail that fails (LLM down, odd body) must not stop the others.
        # It stays unlabeled for the next run; require_all_ok below still
        # marks this run as failed.
        transmitFailed: false

      # All results of this run in one log entry, visible in the execution's
      # own log view. concurrencyLimit 1 runs the iterations in order, so the
      # completion order of the list is the mail order (newest first).
      - id: log_results
        type: io.kestra.plugin.core.log.Log
        message: |-
          {{ outputs.each_email.iterationCount }} mail(s), iterations by state: {{ outputs.each_email.terminatedIterations | toJson }}{% for result in outputs.each_email.outputs %}{% if (result.outputs.category ?? '') is not empty %}
          {{ vars.label_parent }}/{{ result.outputs.category }}{% if result.outputs.dmarc_override %} (DMARC failed; model said {{ result.outputs.model_category }}){% endif %}: "{{ result.outputs.subject }}" from {{ result.outputs.from }} ({{ result.outputs.received_at }})
              sender verified: {{ result.outputs.sender_verified }}{% if (result.outputs.rule ?? '') is not empty %}
              rule: {{ result.outputs.rule }}{% endif %}{% if (result.outputs.reason ?? '') is not empty %}
              {{ result.outputs.reason }}{% endif %}{% endif %}{% endfor %}

      - id: require_all_ok
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ (outputs.each_email.terminatedIterations.FAILED ?? 0) > 0 }}"
        errorMessage: >-
          {{ outputs.each_email.terminatedIterations.FAILED }} of
          {{ outputs.each_email.iterationCount }} mail(s) failed and stay
          unlabeled for the next run. Their errors are in the log view with
          the filter Kind = Loop.

triggers:
  - id: every_2_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/2 * * * *"
    # After downtime, run once instead of once per missed slot; every run
    # picks up whatever is unlabeled anyway.
    recoverMissedSchedules: LAST
